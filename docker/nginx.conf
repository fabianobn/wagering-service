worker_processes 1;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=2s ipv6=off;
  server {
    listen 80;
    location / {
      proxy_http_version 1.1;
      set $upstream http://app:3000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
  }
}
